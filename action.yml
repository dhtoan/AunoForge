name: AunoForge Review
description: Evidence-aware, human-controlled open-source maintenance review.
author: AunoForge contributors
inputs:
  command:
    description: AunoForge command. v0.2 supports review.
    required: false
    default: review
  provider:
    description: "Provider adapter: mock, codex, or claude."
    required: false
    default: mock
  model:
    description: Model name required for live providers.
    required: false
    default: ''
  format:
    description: "Report format: markdown, json, terminal, or sarif."
    required: false
    default: markdown
  baseline:
    description: Optional path to a prior AunoForge JSON report for incremental comparison.
    required: false
    default: ''
  comment:
    description: Post the generated report to the pull request.
    required: false
    default: 'false'
  allow-write:
    description: Explicitly enable the optional PR comment write boundary.
    required: false
    default: 'false'
outputs:
  report-path:
    description: Absolute path to the generated review report.
runs:
  using: node24
  main: dist/action/index.mjs

name: Temporary security Action runtime refresh
on:
  push:
    branches:
      - tmp/security-action-runtime-33
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/security-action-runtime-33
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:action
      - name: Save generated Action runtime
        run: cp dist/action/index.mjs "$RUNNER_TEMP/index.mjs"
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-security-action-docs
          fetch-depth: 1
      - name: Commit generated Action runtime only
        shell: bash
        run: |
          cp "$RUNNER_TEMP/index.mjs" dist/action/index.mjs
          git status --short
          test -z "$(git status --porcelain --untracked-files=all -- dist/action/cli.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/index.mjs
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh packaged security Action runtime"
          git push origin HEAD:feat/v0.2-security-action-docs

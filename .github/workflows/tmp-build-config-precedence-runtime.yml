name: Temporary config precedence runtime refresh

on:
  push:
    branches:
      - tmp/config-precedence-runtime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/config-precedence-cli-green
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build packaged Action runtime
        run: pnpm build:action
      - name: Verify expected generated drift
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- dist/action/index.mjs)"
          changed="$(git diff --name-only -- dist/action)"
          test "$changed" = "dist/action/cli.mjs"
      - name: Commit packaged CLI runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/cli.mjs
          git commit -m "build: refresh packaged CLI config precedence runtime"
          git push origin HEAD:fix/config-precedence-cli-green

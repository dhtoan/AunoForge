name: Temporary release PR runtime refresh
on:
  push:
    branches:
      - tmp/release-pr-evidence-runtime-37
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/release-pr-evidence-runtime-37
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:action
      - name: Save generated CLI runtime
        run: cp dist/action/cli.mjs "$RUNNER_TEMP/cli.mjs"
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-release-pr-evidence
          fetch-depth: 1
      - name: Commit generated CLI runtime only
        shell: bash
        run: |
          cp "$RUNNER_TEMP/cli.mjs" dist/action/cli.mjs
          test -z "$(git status --porcelain --untracked-files=all -- dist/action/index.mjs)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/cli.mjs
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh packaged release PR runtime"
          git push origin HEAD:feat/v0.2-release-pr-evidence

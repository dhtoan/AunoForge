name: Phase 4 README Green

on:
  push:
    branches:
      - feat/v0.2-readme-stable-install
    paths:
      - .github/workflows/phase4-readme-green.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-readme-stable-install
      - name: Apply guarded Phase 4 README edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('README.md')
          text = path.read_text()

          marker = "---\n\n## Why AunoForge?"
          if marker not in text:
              raise SystemExit('README hero marker not found')

          proof = dedent('''\
          ---

          ## ⚡ 60-second proof

          Want the shortest proof path? Copy this workflow into `.github/workflows/aunoforge.yml`. It uses the released **v0.1.0** Action, the zero-key `mock` provider, read-only permissions, and no PR comments. GitHub runner startup time varies.

          ```yaml
          name: AunoForge Proof

          on:
            pull_request:

          permissions:
            contents: read
            issues: read
            pull-requests: read

          jobs:
            review:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dhtoan/AunoForge@v0.1.0
                  with:
                    provider: mock
                    format: markdown
                    comment: 'false'
          ```

          No API key is required. The stable Action generates a Markdown review report without enabling repository writes. A maintained CI smoke workflow runs this exact release tag, and the full copy-paste file lives at [docs/examples/aunoforge-review.yml](docs/examples/aunoforge-review.yml).

          > **Stable vs. current main:** `v0.1.0` is the published stable Action. SARIF, incremental baselines, Step Summary, and the prebuilt Node 24 runtime are current-main / upcoming v0.2 capabilities and are intentionally documented separately in [the v0.2 example](docs/examples/aunoforge-review-v0.2.yml).

          ---

          ## Why AunoForge?''')
          text = text.replace(marker, proof, 1)

          old_table = '| ⚙️ **GitHub Action** | `uses: dhtoan/AunoForge@main` | Runs AunoForge review in CI | `comment: false` |'
          new_table = '| ⚙️ **GitHub Action** | `uses: dhtoan/AunoForge@v0.1.0` | Runs the published stable AunoForge review in CI | `comment: false` |'
          if old_table not in text:
              raise SystemExit('README capability-table Action reference not found')
          text = text.replace(old_table, new_table, 1)

          old_action = '      - uses: dhtoan/AunoForge@main\n        with:\n          provider: mock\n          format: markdown\n          comment: \'false\''
          new_action = '      - uses: dhtoan/AunoForge@v0.1.0\n        with:\n          provider: mock\n          format: markdown\n          comment: \'false\''
          if old_action not in text:
              raise SystemExit('README GitHub Action example reference not found')
          text = text.replace(old_action, new_action, 1)

          old_intro = 'AunoForge includes a composite GitHub Action that defaults to **read-only review** and **does not post comments**.'
          new_intro = 'The published **v0.1.0** release includes a GitHub Action that defaults to **read-only review** and **does not post comments**.'
          if old_intro not in text:
              raise SystemExit('README Action intro not found')
          text = text.replace(old_intro, new_intro, 1)

          anchor = 'AunoForge never auto-merges a pull request from this workflow.\n'
          note = anchor + '\nFor current-main / upcoming v0.2 features such as SARIF and incremental baselines, use the explicitly labeled [v0.2 example](docs/examples/aunoforge-review-v0.2.yml) rather than assuming those inputs exist in v0.1.0.\n'
          if anchor not in text:
              raise SystemExit('README Action close marker not found')
          text = text.replace(anchor, note, 1)

          if 'dhtoan/AunoForge@main' in text:
              raise SystemExit('README still contains a moving public Action reference')

          path.write_text(text)
          PY
      - name: Commit README only
        shell: bash
        run: |
          git add README.md
          test "$(git diff --cached --name-only)" = "README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: lead with stable 60-second proof"
          git push origin HEAD:feat/v0.2-readme-stable-install

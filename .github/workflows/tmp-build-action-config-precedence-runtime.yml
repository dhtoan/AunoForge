name: Temporary Action Config Precedence Runtime Refresh

on:
  push:
    branches:
      - tmp/action-config-precedence-runtime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-action-config-precedence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Regenerate packaged Action runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "af52e56597dcf40c2697c224486e26cf849ff968"
          pnpm build:action
          git diff --exit-code -- dist/action/cli.mjs
          changed="$(git diff --name-only -- dist/action | sort)"
          test "$changed" = "dist/action/index.mjs"
          test -z "$(git status --porcelain --untracked-files=all -- dist/action | awk '$2 != "dist/action/index.mjs" {print}')"
      - name: Push generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/index.mjs
          git commit -m "build: refresh packaged action config precedence runtime"
          git push origin HEAD:feat/v0.2-action-config-precedence

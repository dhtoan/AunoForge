name: Package Incremental Action Runtime

on:
  push:
    branches:
      - feat/v0.2-incremental-evidence
    paths:
      - .github/workflows/package-incremental-action-runtime.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:action
      - name: Verify full Phase 3 suite against generated runtime
        run: pnpm test
      - name: Verify generated runtime is reproducible
        run: |
          sha256sum dist/action/index.mjs dist/action/cli.mjs > /tmp/action-runtime.sha256
          pnpm build:action
          sha256sum dist/action/index.mjs dist/action/cli.mjs | diff -u /tmp/action-runtime.sha256 -
      - name: Commit generated runtime only
        run: |
          git diff --exit-code -- pnpm-lock.yaml
          git add dist/action/index.mjs dist/action/cli.mjs
          if git diff --cached --quiet; then
            echo "Generated runtime already matches the branch."
            exit 0
          fi
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "dist/action/cli.mjs dist/action/index.mjs "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Action runtime for incremental review"
          git push origin HEAD:feat/v0.2-incremental-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-action-runtime
          path: dist/action
          retention-days: 1

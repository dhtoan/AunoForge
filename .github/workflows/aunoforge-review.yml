name: AunoForge Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: aunoforge-markdown
        with:
          command: review
          provider: mock
          format: markdown
          comment: 'false'
      - uses: ./
        id: aunoforge-json
        with:
          command: review
          provider: mock
          format: json
          comment: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: aunoforge-review
          path: |
            ${{ steps.aunoforge-markdown.outputs.report-path }}
            ${{ steps.aunoforge-json.outputs.report-path }}

name: AunoForge Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: aunoforge-markdown
        with:
          command: review
          provider: mock
          format: markdown
          comment: 'false'
      - uses: ./
        id: aunoforge-json
        with:
          command: review
          provider: mock
          format: json
          comment: 'false'
      - uses: ./
        id: aunoforge-sarif
        with:
          command: review
          provider: mock
          format: sarif
          comment: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aunoforge-report
          path: |
            ${{ steps.aunoforge-markdown.outputs.report-path }}
            ${{ steps.aunoforge-json.outputs.report-path }}
            ${{ steps.aunoforge-sarif.outputs.report-path }}

name: Package Node 24 Action Runtime

on:
  push:
    branches:
      - feat/v0.2-node24-action-runtime

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:action
      - run: node --test test/action-runtime.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aunoforge-node24-action-runtime
          path: dist/action
          if-no-files-found: error

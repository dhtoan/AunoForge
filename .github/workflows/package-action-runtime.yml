name: Package Action Runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:action
      - name: Smoke packaged CLI
        run: node dist/action/cli.mjs --help
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-action-runtime
          path: |
            dist/action/index.mjs
            dist/action/cli.mjs
            pnpm-lock.yaml

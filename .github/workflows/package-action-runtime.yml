name: Package Action Runtime
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:action
      - name: Smoke packaged CLI
        run: node dist/action/cli.mjs --help
      - name: Commit generated runtime on the internal milestone branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/v0.2-packaged-action-runtime'
        shell: bash
        run: |
          if test -z "$(git status --porcelain --untracked-files=all -- dist/action)"; then
            echo "Generated runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action/index.mjs dist/action/cli.mjs
          git commit -m "build: regenerate packaged action runtime"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-action-runtime
          path: |
            dist/action/index.mjs
            dist/action/cli.mjs

name: Stable Action Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - README.md
      - docs/examples/aunoforge-review.yml
      - .github/workflows/stable-action-smoke.yml
      - test/readme-stable-install.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  stable-v0-1-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dhtoan/AunoForge@v0.1.0
        id: aunoforge-stable
        with:
          provider: mock
          format: markdown
          comment: 'false'

      - name: Publish stable proof to job summary
        shell: bash
        run: |
          echo '## AunoForge v0.1.0 stable proof' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat '${{ steps.aunoforge-stable.outputs.report-path }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stable proof report
        uses: actions/upload-artifact@v7
        with:
          name: aunoforge-v0.1.0-proof
          path: ${{ steps.aunoforge-stable.outputs.report-path }}
          if-no-files-found: error
          retention-days: 14

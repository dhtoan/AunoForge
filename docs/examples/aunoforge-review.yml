name: AunoForge Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dhtoan/AunoForge@v0.1.0
        id: aunoforge
        with:
          provider: mock
          format: markdown
          comment: 'false'

      # Optional: persist the stable report without enabling PR comments.
      - name: Upload AunoForge report (optional)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aunoforge-report
          path: ${{ steps.aunoforge.outputs.report-path }}
          if-no-files-found: error

name: AunoForge Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dhtoan/AunoForge@v0.1.0
        id: aunoforge
        with:
          provider: mock
          format: markdown
          comment: 'false'

      # Optional: persist the stable report without enabling PR comments.
      - name: Upload AunoForge report (optional)
        uses: actions/upload-artifact@v7
        with:
          name: aunoforge-report
          path: ${{ steps.aunoforge.outputs.report-path }}
          if-no-files-found: error

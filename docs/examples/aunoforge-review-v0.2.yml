# Unreleased v0.2/current-main example. This file intentionally follows @main.
# For the stable v0.1.0 copy-paste workflow, use docs/examples/aunoforge-review.yml.
name: AunoForge Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Optional: restore or download a prior AunoForge JSON report into this path.
      # Artifact retention/download orchestration stays outside AunoForge core.
      - uses: dhtoan/AunoForge@main
        id: aunoforge
        with:
          command: review
          provider: mock
          format: sarif
          baseline: .aunoforge/baseline.json
          comment: 'false'

      # Optional: persist the generated SARIF report. Step Summary and workflow annotations work without this.
      - name: Upload AunoForge report (optional)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aunoforge-report
          path: ${{ steps.aunoforge.outputs.report-path }}
          if-no-files-found: error

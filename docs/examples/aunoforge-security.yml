# Unreleased v0.2/current-main security inventory example.
name: AunoForge Security Inventory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dhtoan/AunoForge@main
        id: aunoforge-security
        with:
          command: security
          format: json

      - name: Upload AunoForge security inventory (optional)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aunoforge-security-inventory
          path: ${{ steps.aunoforge-security.outputs.report-path }}
          if-no-files-found: error
